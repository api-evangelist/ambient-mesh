specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Ambient Mesh
providerId: ambient-mesh
created: '2026-05-04'
modified: '2026-09-02'
generated: '2026-09-02'
method: searched
source: https://ambientmesh.io/docs/
description: >-
  Ambient Mesh publishes no rate limits, and none apply: there is no
  vendor-hosted API to meter. The software runs in the operator's own Kubernetes
  cluster, so the only request ceiling is the operator's own kube-apiserver
  throttling, which Ambient Mesh neither sets nor signals.
limit_count: 0
limits: []
headers: {}
responseCodes: {}

# ---------------------------------------------------------------------------
# 2026-09-02: this file previously carried five invented limits across free /
# professional / enterprise tiers (10, 100, 1,000 rpm; 1,000 and 100,000
# requests per month) and an invented X-RateLimit-* / Retry-After header set,
# written by the 2026-05-04 bulk sweep and never observed on any Ambient Mesh
# response. Replaced with the measured zero. See roadmap#35.
# ---------------------------------------------------------------------------

evidence:
  - url: https://ambientmesh.io/docs/
    status: 200
    note: >-
      No rate-limit, quota or throttling page in the documentation index or in
      https://ambientmesh.io/llms.txt.
  - url: https://ambientmesh.io/
    status: 200
    note: >-
      No API host. repair-api-bases.py returns `no-usable-base` for this
      provider; deliveryModel.callable_host is false.

related_capability:
  note: >-
    Ambient Mesh is a producer of traffic-control capability rather than a
    consumer-facing metered API. The resiliency features an operator configures
    for their OWN services — circuit breaking, outlier detection, request
    timeouts, HTTP retries, fault injection — are documented under
    https://ambientmesh.io/docs/resiliency/. They are not rate limits on an
    Ambient Mesh API and are deliberately not recorded here as such.

