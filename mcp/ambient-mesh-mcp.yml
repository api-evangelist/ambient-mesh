related_agent_surfaces:
  - name: llms.txt
    url: https://ambientmesh.io/llms.txt
    status: 200
    note: served by the provider itself; saved verbatim to llms/ambient-mesh-llms.txt
  - name: markdown twins
    pattern: https://ambientmesh.io/docs/<path>.md
    status: 200
    content_type: text/markdown
    note: >-
      Every docs page is retrievable as raw markdown by appending .md to the
      path WITHOUT the trailing slash (…/key-concepts.md is 200 text/markdown;
      …/key-concepts/index.md and …/key-concepts/.md are both 404). Announced
      in a banner on every docs page.
