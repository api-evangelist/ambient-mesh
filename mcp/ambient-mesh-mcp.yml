tools:
- name: search
  description: Search documentation across 15 named Solo.io product doc collections. Requires both a query
    and a product from a closed enum.
  read_only: true
  parameters:
  - name: query
    type: string
    required: true
    max_length: 2000
  - name: product
    type: string
    required: true
    enum:
    - solo-enterprise-for-istio
    - solo-enterprise-for-kagent
    - solo-enterprise-for-kgateway
    - solo-enterprise-for-agentgateway
    - agentgateway-kubernetes
    - agentgateway-standalone
    - solo-enterprise-for-agentregistry
    - agentregistry-oss
    - kgateway-oss
    - kagent-oss
    - gloo-mesh-enterprise
    - gloo-edge
    - gloo-gateway-v1
    - gateway-api
    - agentevals-oss
  - name: limit
    type: number
    required: false
    default: 4
  note: No ambient-mesh / ambientmesh.io collection exists in this enum, so this tool cannot search the
    Ambient Mesh docs corpus.
- name: get_chunks
  description: Retrieve sequential segments of an indexed document to fill in missing context.
  read_only: true
  parameters:
  - name: collection
    type: string
    required: true
  - name: url
    type: string
    required: true
  - name: startIndex
    type: integer
    required: true
  - name: endIndex
    type: integer
    required: true
- name: get_full_page
  description: Retrieve the full markdown content of a documentation page by URL.
  read_only: true
  parameters:
  - name: url
    type: string
    required: true
  - name: force
    type: boolean
    required: false
  note: 'VERIFIED against Ambient Mesh: get_full_page with url=https://ambientmesh.io/docs/about/key-concepts/
    returned the ambientmesh.io page markdown. Pages over 20,000 characters error unless force is set.'
