      gateway-api v1.3.0 standard-install.yaml, then applies the matching
      manifest from https://get.ambientmesh.io/yamls/<distro>.yaml. The default
      manifest is 974,651 bytes of text/yaml. Note the version drift: this
      installer pins Gateway API v1.3.0 while the Helm install docs pin v1.5.0.

