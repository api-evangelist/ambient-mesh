provider: Ambient Mesh
providerId: ambient-mesh
description: >-
  Distribution artifacts for Ambient Mesh. There are NO first-party client SDKs
  and no Ambient Mesh package on npm, PyPI, RubyGems, crates.io, NuGet, Maven
  Central, Packagist or pkg.go.dev — the product is not consumed through a
  client library, it is installed into a Kubernetes cluster. What ships instead
  are Helm charts, container images and an install script. No SDKs pointer is
  emitted, because none of these is a client SDK.

