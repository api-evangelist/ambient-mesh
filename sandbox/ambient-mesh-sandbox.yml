local_sandbox:
  name: Quickstart
  url: https://ambientmesh.io/docs/quickstart/
  status: 200
  install: curl https://get.ambientmesh.io | sh -
  detail: >-
    The quickstart script detects the local Kubernetes distribution (k3s, k3d,
    minikube, microk8s, kind-adjacent "default", plus gke and openshift) and
    applies the matching manifest, so a laptop cluster is the sandbox.
  teardown: kubectl delete -f https://get.ambientmesh.io/yamls/default.yaml
  sample_apps:
    - bookinfo
    - curl
    - httpbin
  sample_app_source: https://github.com/istio/istio/tree/1.30.0/samples

