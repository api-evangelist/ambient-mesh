description: >-
  Ambient Mesh publishes a hands-on lab catalog — browser-based guided
  environments where a visitor exercises the mesh without installing anything —
  plus a quickstart path that installs into a throwaway local cluster. There are
  no test credentials, test keys or fixture values to record, because the
  product is self-hosted and issues no vendor credential.

test_credentials:
