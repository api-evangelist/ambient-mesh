source: https://ambientmesh.io/
description: >-
  Ambient Mesh publishes no plans and no prices. It is Apache-2.0 open source
  that you run in your own Kubernetes cluster; there is no metered service, no
  sign-up and no billing surface. Commercial support and the enterprise
  distribution are sold by Solo.io under a separate brand and a separate catalog
  entry, and their prices are not published either.
plan_count: 0
plans: []

# ---------------------------------------------------------------------------
# 2026-09-02: this file previously contained a three-tier Free / Professional /
# Enterprise scaffold with invented request quotas (1,000/mo, 100,000/mo),
# invented rate limits (10, 100, 1,000 rpm) and "TBD" prices, written by the
# 2026-05-04 bulk sweep and never harvested from the provider. Ambient Mesh has
# no such tiers and no such API. The scaffold has been replaced with the
# measured zero. See roadmap#35.
# ---------------------------------------------------------------------------

evidence:
  - url: https://ambientmesh.io/pricing/
    status: 404
    note: no pricing page exists on the provider's own site
  - url: https://ambientmesh.io/
    status: 200
    note: >-
      Homepage carries no pricing or sign-up navigation. Site sections are Get
      Started, Use Cases, Resources (Learning Paths, Labs, FAQ, Cost Savings
      Estimator), Enterprise and Blog.
  - url: https://ambientmesh.io/docs/setup/install/
    status: 200
    note: install is a Helm command against a public chart repository — no account required
  - url: https://ambientmesh.io/docs/operations/solo-builds/
    status: 200
    note: >-
      "Solo builds of Istio are free to use but not open source." HTTP
      observability in ztunnel and FIPS images require a Solo Enterprise for
      Istio licence key; no price is stated.
  - url: https://www.solo.io/products/istio
    status: 200
    note: >-
      Linked from ambientmesh.io as "Enterprise". Commercial offering, contact
      sales; no published price list. Belongs to the solo-io catalog entry.

